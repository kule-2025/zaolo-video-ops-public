<?xml version="1.0" encoding="UTF-8"?>
<!--
  ZAOLO 造流 · 横版锁定组合
  图标(1.0x) + 中文造流(0.5x) + 英文 ZAOLO(0.32x)
  规范：图标-字标间距=图标高度的 25%
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="zg-h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A14E8"/>
      <stop offset="50%" stop-color="#7A3CFF"/>
      <stop offset="100%" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>

  <!-- 图标（左侧）-->
  <g transform="translate(10,10)">
    <path d="M50 6 L88 28 L88 72 L50 94 L12 72 L12 28 Z" fill="url(#zg-h)"/>
    <path d="M26 56 C 40 56, 42 40, 56 40 C 70 40, 74 60, 78 60"
          stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M66 50 L80 60 L66 70"
          stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 中文字标（视觉主字）-->
  <text x="130" y="56"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="34" font-weight="800" fill="#0F0F23"
        letter-spacing="4">造流</text>

  <!-- 英文字标（副行小字）-->
  <text x="130" y="78"
        font-family="'Inter',sans-serif"
        font-size="13" font-weight="600" fill="#70708C"
        letter-spacing="4">ZAOLO</text>

  <!-- 分隔线 -->
  <line x1="228" y1="34" x2="228" y2="66" stroke="#E8E8F2" stroke-width="1"/>

  <!-- 品牌 tag -->
  <text x="240" y="52"
        font-family="'Inter',sans-serif"
        font-size="10" font-weight="600" fill="#4A14E8"
        letter-spacing="1">视频号全链路</text>
  <text x="240" y="68"
        font-family="'Inter',sans-serif"
        font-size="9" fill="#70708C"
        letter-spacing="1">Automation Suite</text>
</svg>
