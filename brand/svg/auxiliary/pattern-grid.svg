<?xml version="1.0" encoding="UTF-8"?>
<!--
  ZAOLO · 辅助图形-数据点阵
  用途：数据可视化底纹、看板背景、图表装饰
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="zg-dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#4A14E8" opacity="0.28"/>
      <circle cx="20" cy="20" r="1" fill="#FF6A1A" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#zg-dots)"/>
  <!-- 高亮流：一条数据走向 -->
  <path d="M40 340 Q 120 200 200 240 T 360 100"
        stroke="#4A14E8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M340 108 L360 100 L352 118"
        stroke="#FF6A1A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- 数据节点 -->
  <g>
    <circle cx="40"  cy="340" r="4" fill="#4A14E8"/>
    <circle cx="200" cy="240" r="5" fill="#7A3CFF"/>
    <circle cx="360" cy="100" r="6" fill="#FF6A1A"/>
  </g>
</svg>
